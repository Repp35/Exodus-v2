name: Build and publish protected Exodus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exodus-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXODUS_BLOCKED_USER_IDS: ${{ secrets.EXODUS_BLOCKED_USER_IDS }}
      EXODUS_ALLOWED_GAME_IDS: ${{ vars.EXODUS_ALLOWED_GAME_IDS }}
      EXODUS_ALLOWED_PLACE_IDS: ${{ vars.EXODUS_ALLOWED_PLACE_IDS }}
      EXODUS_EXPIRES_AT: ${{ vars.EXODUS_EXPIRES_AT }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate protected build
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build-source site
          mkdir -p build-source/security "site/${REVISION}"

          cp -R "exodus hub" build-source/
          # This standalone diagnostic is not loaded by the hub and is not published.
          rm -rf "build-source/exodus hub/indeed"

          python3 - <<'PY'
          import os
          from pathlib import Path

          def parse_ids(name):
              raw = os.environ.get(name, "")
              values = []
              for item in raw.split(","):
                  item = item.strip()
                  if not item:
                      continue
                  if not item.isdecimal():
                      raise SystemExit(f"{name} contains a non-numeric value")
                  values.append(int(item))
              return sorted(set(values))

          blocked_user_ids = parse_ids("EXODUS_BLOCKED_USER_IDS")
          game_ids = parse_ids("EXODUS_ALLOWED_GAME_IDS")
          place_ids = parse_ids("EXODUS_ALLOWED_PLACE_IDS")
          expires_at = os.environ.get("EXODUS_EXPIRES_AT", "").strip() or "0"
          if not expires_at.isdecimal():
              raise SystemExit("EXODUS_EXPIRES_AT must be a Unix timestamp or empty")

          lines = [
              "-- Generated by the protected-release workflow.",
              "return {",
              "  schema = 1,",
              '  product = "Exodus-v2",',
              f'  revision = "{os.environ["REVISION"]}",',
          ]
          for field, values in (
              ("blockedUserIds", blocked_user_ids),
              ("gameIds", game_ids),
              ("placeIds", place_ids),
          ):
              lines.append(f"  {field} = {{")
              for value in values:
                  lines.append(f"    [{value}] = true,")
              lines.append("  },")
          lines.append(f"  expiresAt = {int(expires_at)},")
          lines.append("}")
          Path("build-source/security/entitlements.luau").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          # Publish the private source as-is. No obfuscator is used.
          cp -R "build-source/." "site/${REVISION}/"

          cp "site/${REVISION}/exodus hub/loader.luau" site/loader.luau

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def fingerprint(data):
              a, b = 1, 0
              for byte in data:
                  a = (a + byte) % 65521
                  b = (b + a) % 65521
              return f"{b:04x}{a:04x}"

          revision_dir = Path("site") / os.environ["REVISION"]
          signatures = {
              p.relative_to(revision_dir).as_posix(): fingerprint(p.read_bytes())
              for p in revision_dir.rglob("*.luau")
          }

          Path("site/manifest.json").write_text(
              json.dumps({
                  "schema": 1,
                  "product": "Exodus-v2",
                  "revision": os.environ["REVISION"],
                  "signatures": signatures,
              }, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          test -s site/loader.luau
          test -s site/manifest.json
          test -s "site/${REVISION}/security/entitlements.luau"
          test -s "site/${REVISION}/exodus hub/loader.luau"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload protected distribution
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy protected distribution
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify live clients
        env:
          REVISION: ${{ github.sha }}
          UPDATE_TOPIC: exodus-v2-live-9f36c3d1e8b24a7c
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "Title: Exodus update" \
            -H "Content-Type: text/plain" \
            --data "${REVISION}" \
            "https://ntfy.sh/${UPDATE_TOPIC}"
