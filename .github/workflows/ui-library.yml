name: Validate UI Library
on:
  pull_request:
  push:
    paths:
      - 'ui-library/**'
      - 'exodus hub/modules/front/**'
      - 'exodus hub/loader.luau'
      - 'exodus hub/indeed/**'
      - '.github/workflows/ui-library.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official Luau CLI
        run: |
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile
      - name: Check source formatting
        run: |
          chmod +x 'exodus hub/indeed/stylua-linux-x86_64'
          'exodus hub/indeed/stylua-linux-x86_64' --check --config-path ui-library/stylua.toml ui-library/src ui-library/tests ui-library/examples
      - name: Check generated distribution
        run: python3 ui-library/scripts/build.py --check
      - name: Compile and test component and adapter behavior
        run: python3 ui-library/scripts/test.py --luau /tmp/luau/luau --compiler /tmp/luau/luau-compile
      - name: Check existing hub contracts and formatter
        run: python3 -m unittest discover -s 'exodus hub/indeed/tests' -p 'test_*.py'
