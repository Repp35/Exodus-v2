name: Format Exodus Luau
on:
  push:
    paths:
      - '.github/workflows/format-luau.yml'
      - 'exodus hub/**/*.luau'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format all Luau files using repository formatter
        run: |
          chmod +x "exodus hub/indeed/stylua-linux-x86_64"
          python3 "exodus hub/indeed/formatter.py" --in-place --no-compact-runs "exodus hub"
          python3 "exodus hub/indeed/formatter.py" --check --no-compact-runs "exodus hub"
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- 'exodus hub'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'exodus hub'
            git commit -m "style: format all Luau modules with project formatter"
            git push
          fi
