name: Format Exodus Luau
on:
  push:
    paths:
      - '.github/workflows/format-luau.yml'
      - 'exodus hub/**/*.luau'
      - 'exodus hub/indeed/*.py'
      - 'exodus hub/indeed/tests/**'
      - 'exodus hub/indeed/stylua.toml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test formatter configuration audit
        run: python3 -m unittest discover -s "exodus hub/indeed/tests" -p "test_*.py"
      - name: Test frontend library and host integration
        run: |
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile
          python3 "exodus hub/indeed/test_ui.py" --luau /tmp/luau/luau --compiler /tmp/luau/luau-compile
      - name: Format all Luau files using repository formatter
        run: |
          chmod +x "exodus hub/indeed/stylua-linux-x86_64"
          python3 "exodus hub/indeed/formatter.py" --in-place "exodus hub"
          python3 "exodus hub/indeed/formatter.py" --check "exodus hub"
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- 'exodus hub'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'exodus hub'
            git commit -m "style: format all Luau modules with project formatter"
            git push
          fi
